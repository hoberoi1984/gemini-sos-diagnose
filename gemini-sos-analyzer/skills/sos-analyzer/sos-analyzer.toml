[[rule]]
name = "Automatically allow sos-analyzer skill activation"
toolName = "activate_skill"
argsPattern = '.*"name":"sos-analyzer".*'
decision = "allow"
priority = 100

[[rule]]
name = "Allow sos-analyzer diagnostic scripts"
toolName = "run_shell_command"
commandPattern = 'python .*scripts/(extract_logs|generate_json)\.py.*'
decision = "allow"
priority = 100

[[rule]]
name = "Allow standard SOS research commands"
toolName = "run_shell_command"
commandPattern = '^(tar|grep|find|cat|head|tail|gzip|gunzip|Get-ChildItem|Select-Object|diff|mkdir) .*'
decision = "allow"
priority = 90

[[rule]]
name = "Allow creation of analysis summaries"
toolName = "write_file"
argsPattern = '.*"file_path":"analysis_summary\.json".*'
decision = "allow"
priority = 100
